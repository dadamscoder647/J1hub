# Review-only staging Blueprint. The first explicit apply provisions and deploys
# these resources. Set Blueprint Auto Sync to No in Render before later updates.
services:
  - type: web
    name: j1hub-staging-api
    runtime: python
    branch: main
    region: oregon
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app app:create_app db upgrade
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 'app:create_app()'"
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    disk:
      name: j1hub-staging-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: j1hub-staging-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: j1hub-staging-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: RATELIMIT_STORAGE_URI
        value: memory://

  - type: web
    name: j1hub-staging-web
    runtime: static
    branch: main
    buildCommand: 'cd frontend && npm ci && VITE_API_BASE_URL="${J1HUB_API_ORIGIN}/api/v1" npm run build'
    staticPublishPath: frontend/dist
    autoDeployTrigger: "off"
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: J1HUB_API_ORIGIN
        fromService:
          name: j1hub-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: j1hub-staging-db
    plan: 0.1c-256mb
    region: oregon
    diskSizeGB: 1
    postgresMajorVersion: "16"
    ipAllowList: []
