name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type-check application factory and configuration
        run: mypy --ignore-missing-imports --follow-imports skip app.py config.py
      - name: Check OpenAPI stays in sync with API changes
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            ./scripts/check_openapi_sync.sh "origin/$BASE_REF"
          elif [[ -n "$EVENT_BEFORE" ]]; then
            ./scripts/check_openapi_sync.sh "$EVENT_BEFORE"
          else
            ./scripts/check_openapi_sync.sh
          fi

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret
      DATABASE_URL: sqlite:///test.db
      UPLOAD_DIR: workspace/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend smoke tests
        working-directory: frontend
        run: npm run test:e2e

  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/appdb
      UPLOAD_DIR: workspace/uploads
      FLASK_APP: app:create_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install psycopg2-binary
      - name: Verify clean database upgrade and schema
        run: |
          mkdir -p workspace/uploads
          test "$(flask db heads | wc -l | tr -d ' ')" = "1"
          flask db upgrade
          flask db check
      - name: Verify upgrades preserve existing verification documents
        run: |
          flask db downgrade base
          flask db upgrade 1b5a52d73d61
          python scripts/check_migration_document_preservation.py seed
          flask db upgrade
          python scripts/check_migration_document_preservation.py check
          flask db check
